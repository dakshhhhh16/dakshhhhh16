name: Update GitHub profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: github-profile-stats
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refresh README stats
        env:
          GITHUB_USERNAME: dakshhhhh16
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_github_stats.py

      - name: Commit refreshed stats
        run: |
          if git diff --quiet README.md; then
            echo "README stats are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update GitHub stats"
          git push
